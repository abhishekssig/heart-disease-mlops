name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: heart-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8==7.1.1
      - name: flake8
        run: flake8 heartml tests --tee --output-file=flake8-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: flake8-report.txt

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: pytest --junitxml=junit.xml --cov=heartml --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: data
        run: python -m heartml.data
      - name: eda
        run: python -m heartml.eda
      - name: train
        run: python -m heartml.train 2>&1 | tee train.log
      - name: check model quality
        run: |
          python -c "
          import json, sys
          m = json.load(open('models/metadata.json'))['metrics']
          print(json.dumps(m, indent=2))
          sys.exit(0 if m['test_roc_auc'] >= 0.80 else 1)
          "
      - name: inference smoke test
        run: python -m heartml.predict sample_batch.json
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/
      - uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            train.log
            reports/
            mlruns/
            data/processed/

  docker:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models/
      - name: build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - name: run container
        run: |
          docker run -d --name api -p 8000:8000 $IMAGE_NAME:latest
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
      - name: test endpoints
        run: |
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" -d @sample_input.json | tee predict.json
          python3 -c "import json; r = json.load(open('predict.json')); assert r['prediction'] in (0, 1) and 0.5 <= r['confidence'] <= 1"
          curl -sf localhost:8000/metrics | grep heart_api_predictions_total
      - name: container logs
        if: always()
        run: docker logs api > container.log 2>&1; cat container.log
      - name: save image
        run: docker save $IMAGE_NAME:latest | gzip > heart-api-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-outputs
          path: |
            container.log
            predict.json
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: heart-api-image.tar.gz
          retention-days: 7
