groups:
  - name: heart-api
    rules:
      - alert: HeartApiDown
        expr: up{job="heart-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Heart API target is down
      - alert: HeartApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(heart_api_request_latency_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 latency above 500ms
      - alert: HeartApiErrors
        expr: sum(rate(heart_api_requests_total{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Heart API is returning 5xx responses
